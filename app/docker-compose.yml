services:
  web:
    build: ./web
    volumes:
      - ./web:/app
    ports:
      - "8000:8000"
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=cultivo_maiz
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    container_name: django_web
    networks:
      - app_network

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=cultivo_maiz
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d  # Volumen para scripts de inicialización
    container_name: postgres_db
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@email.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json  # Configuración automática
    ports:
      - "8080:80"
    depends_on:
      - db
    container_name: pg_admin
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge